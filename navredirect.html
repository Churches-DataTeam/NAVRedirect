<!DOCTYPE html>
<html>
<body>
<h1 id="msg">Opening NAV, please wait...</h1>
<script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    if (url) window.location = decodeURIComponent(url);
    setTimeout(() => {
        window.close();
        // If window.close() failed, show the message
        setTimeout(() => {
            document.getElementById("msg").innerText = "You can close this tab.";
        }, 500);
    }, 5000);
</script>
</body>
</html>
